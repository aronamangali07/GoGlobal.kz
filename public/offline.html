<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a1c">
<title>Нет подключения · GoGlobal</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e9eeff;
    background: radial-gradient(120% 80% at 70% 0%, #1a2a6c 0%, #070d26 55%, #040817 100%); }
  .card { max-width: 360px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 20px 50px -20px #6d8bff; animation: float 4s ease-in-out infinite; }
  h1 { font-size: 24px; margin: 24px 0 8px; }
  p { color: #9aa6c8; line-height: 1.5; margin: 0 0 24px; }
  button { font: inherit; font-weight: 700; color: #050a1c; background: #ff9a52; border: 0; border-radius: 14px; padding: 14px 24px; cursor: pointer; }
  @keyframes float { 50% { transform: translateY(-8px) rotate(-3deg); } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Нет подключения к интернету</h1>
    <p>Самолёт ждёт сигнала ✈️ Как только связь вернётся, страница откроется — офферы и уведомления никуда не денутся.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
